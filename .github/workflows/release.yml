name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Check release version
        id: check
        run: python3 .github/scripts/check_version.py --tag "${{ github.ref_name }}" --root .

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: "10"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: "webui/pnpm-lock.yaml"

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: "go.mod"

      - name: Build release artifacts
        run: sh .github/scripts/build_release.sh

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          TAG="${{ github.ref_name }}"
          FLAG=""
          if [ "${{ steps.check.outputs.prerelease }}" = "true" ]; then FLAG="--prerelease"; fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" $FLAG
            gh release upload "$TAG" phoneserver-module.zip phoneserver-arm64 phoneserver-module.zip.sha256 --clobber
          else
            gh release create "$TAG" --title "phoneserver $TAG" --generate-notes $FLAG phoneserver-module.zip phoneserver-arm64 phoneserver-module.zip.sha256
          fi
